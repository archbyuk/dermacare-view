# 워크플로우 이름
name: Tauri Build & Release

# 워크플로우 트리거
on:
    # v1.0.0, v0.9.2 등 버전 태그 푸시 시 자동 실행
    push:
        tags:
            - 'v*'
    workflow_dispatch:

# 워크 플로우 작업        
jobs:
    build-tauri:
        strategy:
            # 실패 시 계속 실행
            fail-fast: false
            matrix:
                # 빌드 플랫폼(macOS, Windows)
                platform: [macos-latest, windows-latest]

        runs-on: ${{ matrix.platform }}
        
        # 워크 플로우 작업 단계
        steps:
            # 저장된 코드 가져오기
            - name: Checkout code
              uses: actions/checkout@v4

            # Node.js 설치
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            # Rust 설치
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            # Node.js 의존성 설치
            - name: Install Node dependencies
              run: npm ci

            # Tauri 앱 빌드
            - name: Build Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                    tagName: ${{ github.ref_name }}
                    releaseName: 'FaceFilter MSO ${{ github.ref_name }}'
                    releaseBody: |
                        ## FaceFilter MSO Desktop 앱
                      
                        ### 특징
                        - Vercel 웹 버전과 동일한 기능
                        - 자동으로 최신 버전 로드
                        - 별도 업데이트 불필요 (웹에서 자동 반영)
                        
                        ### 다운로드
                        - **Windows** → `.msi` 또는 `.exe`
                        - **macOS** → `.dmg`
                        
                        > [필수] 앱 실행 시 인터넷 연결이 필요합니다.
                  
                    releaseDraft: false
                    prerelease: false